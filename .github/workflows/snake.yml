# ═══════════════════════════════════════════════════════════════════
# Contribution Snake — generates the animated SVGs once a day and
# pushes them to an orphan `output` branch that the README reads from.
# File path: .github/workflows/snake.yml
# ═══════════════════════════════════════════════════════════════════
name: Generate Contribution Snake

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  # Lets you run it manually from the Actions tab
  workflow_dispatch:
  # Also regenerate on every push to the default branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake-gif
        with:
          # 🔁 SWAP: your GitHub username
          github_user_name: Vineeth-Sagar
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#52FF78
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Push generated SVGs to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
